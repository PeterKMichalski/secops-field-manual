name: Build and Release Application

on:
  release:
    types: [created]

jobs:
  build-macos:
    runs-on: macos-latest

    permissions:
      contents: write

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller app.spec --clean

    - name: Create macOS Zip Archive
      run: zip -r "SecOps-Field-Manual-macOS.zip" "dist/SecOps Field Manual.app"

    - name: Upload macOS Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: SecOps-Field-Manual-macOS.zip

  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller app.spec --clean

    - name: Create Windows Zip Archive
      shell: pwsh
      run: Compress-Archive -Path "dist/SecOps Field Manual" -DestinationPath "SecOps-Field-Manual-Windows.zip"

    - name: Upload Windows Release Asset
      uses: softprops/action-gh-release@v2
      with:
        files: SecOps-Field-Manual-Windows.zip
