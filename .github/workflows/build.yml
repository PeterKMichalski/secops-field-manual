name: Build and Release Application

on:
  release:
    types: [created]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller app.spec --clean

    - name: Create macOS Zip Archive
      run: zip -r "SecOps-Field-Manual-macOS.zip" "dist/SecOps Field Manual.app"

    - name: Upload macOS Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./SecOps-Field-Manual-macOS.zip
        asset_name: SecOps-Field-Manual-macOS.zip
        asset_content_type: application/zip

  build-windows:
    runs-on: windows-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller app.spec --clean

    - name: Create Windows Zip Archive
      shell: pwsh
      run: Compress-Archive -Path "dist/SecOps Field Manual" -DestinationPath "SecOps-Field-Manual-Windows.zip"

    - name: Upload Windows Release Asset
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ github.event.release.upload_url }}
        asset_path: ./SecOps-Field-Manual-Windows.zip
        asset_name: SecOps-Field-Manual-Windows.zip
        asset_content_type: application/zip
