name: Build Application

on:
  release:
    types: [created]

jobs:
  build-macos:
    runs-on: macos-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11' # Use a specific Python version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller "Forensic Field Manual.spec" --clean

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v3
      with:
        name: SecOps-Field-Manual-macOS
        path: dist/SecOps Field Manual.app

  build-windows:
    runs-on: windows-latest

    steps:
    - name: Check out code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller
      run: pyinstaller "Forensic Field Manual.spec" --clean

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v3
      with:
        name: SecOps-Field-Manual-Windows
        path: dist/SecOps Field Manual/SecOps Field Manual.exe
